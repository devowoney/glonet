# Main GLONET Configuration
# ----------------------------- Configuration features
# config/                       
# ├── config.yaml               
# ├── model/                    
# │   ├── glonet.yaml           
# │   ├── glonet_patch.yaml
# │   └── optimic.yaml      
# ├── data/                     
# │   └── GLORYS12.yaml    ✔
# └── training/                 
#     ├── default.yaml
#     ├── fast.yaml   
#     └── optimic.yaml                   
          
# -----------------------------

data_paths: "/Odyssey/public/glonet/glorys12_1993-01-01_to_1993-06-30_init_states/combined_input.nc"
variables: ["data"]

dimensions:
  spatial: ["lat", "lon"]
  time: "time"

computing:
  # time_minibatch_size: 15
  patch_size: [96, 96]
  enable_patching: false

sequence_length: 2
forecast_horizon: 1

preprocessing:
  crop_zone: null
  normalize: false
  standardize: true

# train_split: 0.8
# val_split: 0.1
# test_split: 0.1

# statistics:
#   stat_path: ${hydra:run.dir}/statistics.stat

dataloader:
  batch_size: 32
  num_workers: 8
  pin_memory: true